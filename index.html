<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armana Group | The Future of Denim</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        indigoCustom: '#1b2a4a',
                        denimDark: '#0a0f1d',
                        accentGold: '#c5a880'
                    }
                }
            }
        }
    </script>
    <!-- GSAP & Three.js CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #03050a;
            color: #ffffff;
            overflow: hidden;
            margin: 0;
        }
        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center relative select-none">

    <!-- WebGL Background Canvas Container -->
    <div id="webgl-container"></div>

    <!-- Top Branding Anchor -->
    <header class="relative z-10 w-full flex justify-between items-center px-8 lg:px-16 py-8">
        <div class="flex items-center space-x-4">
            <img src="logo.jpg" alt="Armana Group Logo" class="h-12 w-auto object-contain filter drop-shadow-[0_0_12px_rgba(255,255,255,0.4)] bg-white/10 p-1.5 rounded-sm">
            <div class="hidden sm:block h-6 w-[1px] bg-white/30"></div>
            <span class="hidden sm:inline-block text-xs tracking-[0.3em] uppercase text-gray-200 font-medium">Global Denim Excellence</span>
        </div>
        <div class="text-xs tracking-[0.2em] text-accentGold uppercase font-semibold drop-shadow">
            EST. 1995
        </div>
    </header>

    <!-- Center Stage: Cinematic Presentation -->
    <main class="relative z-10 flex flex-col items-center text-center px-4 max-w-4xl my-auto">
        <div class="overflow-hidden mb-4">
            <span id="subtitle" class="inline-block text-accentGold text-xs md:text-sm tracking-[0.4em] uppercase font-semibold opacity-0 translate-y-6 drop-shadow">
                Architecture of Modern Denim
            </span>
        </div>
        <h1 id="headline" class="text-4xl md:text-7xl font-light tracking-tight text-white mb-6 opacity-0 translate-y-10 drop-shadow-lg">
            Engineered for <span class="font-semibold text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-indigo-100 to-accentGold">Perfection</span>
        </h1>
        <p id="description" class="text-gray-200 text-sm md:text-base max-w-xl font-light leading-relaxed mb-10 opacity-0 translate-y-8 drop-shadow">
            Immersive manufacturing, sustainable innovation, and uncompromised global standards crafted at scale.
        </p>

        <!-- Circular Countdown Progress Indicator -->
        <div id="loader-wrapper" class="relative flex items-center justify-center w-16 h-16 opacity-0 scale-75">
            <svg class="w-full h-full transform -rotate-90">
                <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" class="text-gray-700" fill="transparent"></circle>
                <circle id="progress-ring" cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" class="text-accentGold" fill="transparent" stroke-dasharray="175.92" stroke-dashoffset="175.92"></circle>
            </svg>
            <span id="countdown-text" class="absolute text-xs font-semibold text-accentGold tracking-widest">08s</span>
        </div>
    </main>

    <!-- Footer Security / Redirect Notice -->
    <footer class="relative z-10 w-full flex flex-col sm:flex-row justify-between items-center px-8 lg:px-16 py-8 text-xs text-gray-300 tracking-widest uppercase">
        <div class="drop-shadow">Bangladesh Flagship Operations</div>
        <div class="my-2 sm:my-0 flex items-center space-x-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_#34d399]"></span>
            <span class="drop-shadow">Secure Neural Uplink Active</span>
        </div>
        <div><a href="Home.html" class="text-gray-200 hover:text-white transition-colors duration-300 underline underline-offset-4 drop-shadow">Skip Intro →</a></div>
    </footer>

    <!-- Interactive Three.js & GSAP Engine Scripts -->
    <script>
        // --- Three.js WebGL Particle Denim Weave Background ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Particle Grid simulating Indigo Weave Fabric Matrix
        const particlesCount = 4000;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 12;
            posArray[i+1] = (Math.random() - 0.5) * 12;
            posArray[i+2] = (Math.random() - 0.5) * 6;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const material = new THREE.PointsMaterial({
            size: 0.03,
            color: 0x8ab4f8,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);

        // Mouse interaction tracking
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) - 0.5;
            mouseY = (event.clientY / window.innerHeight) - 0.5;
        });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Render loop
        const clock = new THREE.Clock();
        function animateScene() {
            requestAnimationFrame(animateScene);
            const elapsedTime = clock.getElapsedTime();

            targetX = THREE.MathUtils.lerp(targetX, mouseX, 0.05);
            targetY = THREE.MathUtils.lerp(targetY, mouseY, 0.05);

            particlesMesh.rotation.y = elapsedTime * 0.05 + targetX * 0.3;
            particlesMesh.rotation.x = elapsedTime * 0.03 + targetY * 0.3;

            renderer.render(scene, camera);
        }
        animateScene();

        // --- GSAP Entrance Animations & Automatic Redirection ---
        const tl = gsap.timeline();

        tl.to('#subtitle', { opacity: 1, y: 0, duration: 1, ease: 'power4.out' })
          .to('#headline', { opacity: 1, y: 0, duration: 1.2, ease: 'power4.out' }, '-=0.6')
          .to('#description', { opacity: 1, y: 0, duration: 1, ease: 'power4.out' }, '-=0.8')
          .to('#loader-wrapper', { opacity: 1, scale: 1, duration: 0.8, ease: 'back.out(1.7)' }, '-=0.6');

        // Countdown Timer & Progress Circle Animation (8 Seconds Total)
        const totalTime = 8;
        let timeLeft = totalTime;
        const radius = 28;
        const circumference = 2 * Math.PI * radius;
        const progressRing = document.getElementById('progress-ring');
        const countdownText = document.getElementById('countdown-text');

        progressRing.style.strokeDasharray = circumference;

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            progressRing.style.strokeDashoffset = offset;
        }

        const countdownInterval = setInterval(() => {
            timeLeft -= 1;
            if (timeLeft >= 0) {
                countdownText.innerText = `0${timeLeft}s`;
                setProgress(((totalTime - timeLeft) / totalTime) * 100);
            }
        }, 1000);

        // Auto Redirect after 8 seconds with smooth fade-out
        setTimeout(() => {
            clearInterval(countdownInterval);
            gsap.to('body', {
                opacity: 0,
                duration: 1.2,
                ease: 'power2.inOut',
                onComplete: () => {
                    window.location.href = 'Home.html';
                }
            });
        }, totalTime * 1000);
    </script>
</body>
</html>
